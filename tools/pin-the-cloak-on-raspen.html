<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pin the Cloak on Raspen</title>
<style>
:root{
  --deep:#0a0d12; --stone:#1b222c; --stone-2:#141a22; --edge:#2f3a49;
  --bronze:#b98d43; --bronze-d:#6b4d21; --bronze-l:#edc97f;
  --parch:#e9dcbe; --dim:#93a0ae;
  --eq-white:#f2f0e8; --eq-yellow:#ffe14d; --eq-blue:#7ec8ff; --eq-red:#ff6b5e; --eq-green:#7dfd7d;
  --mono:ui-monospace,"Cascadia Mono",Consolas,"DejaVu Sans Mono",monospace;
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --display:"Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box}
html,body{margin:0; min-height:100%}
body{
  background:
    radial-gradient(1100px 700px at 50% -10%, #1d2735 0%, transparent 60%),
    radial-gradient(700px 500px at 90% 110%, #17202b 0%, transparent 65%),
    var(--deep);
  color:var(--parch); font-family:var(--ui);
  display:flex; align-items:center; justify-content:center; padding:18px;
}
.cabinet{
  width:min(1000px,100%);
  background:linear-gradient(180deg,var(--stone) 0%,var(--stone-2) 100%);
  border:1px solid var(--edge); border-radius:4px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07), 0 20px 60px rgba(0,0,0,.7);
}
.titlebar{
  display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  padding:10px 14px;
  background:linear-gradient(180deg,#3a2f1c 0%,#241d12 100%);
  border-bottom:1px solid var(--bronze-d);
  box-shadow:inset 0 1px 0 rgba(237,201,127,.22);
}
.brand{font-family:var(--display); font-size:19px; letter-spacing:.02em; color:var(--bronze-l);
  text-shadow:0 2px 0 #000; margin-right:auto}
.brand small{display:block; font-family:var(--mono); font-size:10.5px; letter-spacing:.14em;
  text-transform:uppercase; color:#9c8354; text-shadow:none; margin-top:3px}
.seg{display:flex; border:1px solid var(--bronze-d); border-radius:3px; overflow:hidden; background:#171208}
.seg button{
  font:600 11px/1 var(--mono); letter-spacing:.08em; text-transform:uppercase;
  padding:7px 10px; background:transparent; color:#a8906a; border:0; cursor:pointer;
}
.seg button+button{border-left:1px solid var(--bronze-d)}
.seg button[aria-pressed="true"]{background:linear-gradient(180deg,#8f6c2e,#5c421a); color:#fff2d2}
.seg button:hover{color:var(--bronze-l)}
.seg button:focus-visible{outline:2px solid var(--bronze-l); outline-offset:-2px}

.board{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,360px); gap:16px; padding:16px}
@media (max-width:820px){ .board{grid-template-columns:1fr} }

.hud{display:flex; align-items:flex-end; gap:14px; margin-bottom:10px}
.hud .eyebrow{display:block; font:600 10px/1 var(--mono); letter-spacing:.16em;
  text-transform:uppercase; color:#7b8794; margin-bottom:4px}
.hud b{font-family:var(--display); font-size:22px; color:var(--bronze-l); font-weight:400}
.hud .mid{flex:1; text-align:center; font-size:12.5px; color:var(--dim); line-height:1.4}
.hud .right{text-align:right}

.stage{
  position:relative; width:100%; max-width:430px; margin:0 auto;
  aspect-ratio:406/499; overflow:hidden; border-radius:3px;
  border:1px solid #0d1117; background:#05070a;
  box-shadow:inset 0 0 0 1px rgba(237,201,127,.10), inset 0 0 60px rgba(0,0,0,.9);
  touch-action:none; cursor:crosshair; outline:none;
}
.stage:focus-visible{box-shadow:0 0 0 2px var(--bronze-l), inset 0 0 60px rgba(0,0,0,.9)}
.scene{position:absolute; inset:0; transform-origin:50% 50%; will-change:transform}
.scene img.gnome{width:100%; height:100%; display:block; transition:filter .45s ease}
.stage.blind .scene img.gnome{filter:brightness(var(--blind,.5))}
.veil{position:absolute; inset:0; pointer-events:none; opacity:0; transition:opacity .45s ease;
  background:radial-gradient(120% 90% at 50% 45%, rgba(3,5,8,.5) 0%, rgba(3,5,8,.95) 72%)}
.stage.blind .veil{opacity:var(--veil,.5)}

.pin{position:absolute; width:15%; transform:translate(-50%,-50%) rotate(var(--r,0deg));
  image-rendering:pixelated; filter:drop-shadow(0 3px 4px rgba(0,0,0,.7))}
.pin.pop{animation:thud .4s cubic-bezier(.2,1.5,.4,1)}
@keyframes thud{0%{transform:translate(-50%,-50%) rotate(var(--r,0deg)) scale(2.1); opacity:.2}
  100%{transform:translate(-50%,-50%) rotate(var(--r,0deg)) scale(1); opacity:1}}
.tag{position:absolute; transform:translate(-50%,-50%); margin-top:-14px;
  font:700 10px/16px var(--mono); width:16px; height:16px; text-align:center; border-radius:50%;
  background:#1b222c; color:var(--bronze-l); border:1px solid var(--bronze-d)}
.overlay{position:absolute; inset:0; opacity:0; transition:opacity .45s ease; pointer-events:none}
.overlay.show{opacity:1}
.overlay circle{fill:none; stroke:var(--eq-yellow); stroke-width:2; stroke-dasharray:5 5; opacity:.85}
.overlay line{stroke:var(--eq-yellow); stroke-width:1.5; stroke-dasharray:3 4; opacity:.6}

.ghost{position:absolute; width:15%; left:0; top:0; pointer-events:none;
  transform:translate(-50%,-50%); image-rendering:pixelated; opacity:0;
  filter:drop-shadow(0 0 10px rgba(237,201,127,.55))}
.stage.aiming .ghost{opacity:1}

.controls{display:flex; gap:10px; align-items:center; justify-content:center; margin-top:12px; flex-wrap:wrap}
.btn{
  font:600 12px/1 var(--mono); letter-spacing:.1em; text-transform:uppercase;
  padding:11px 18px; cursor:pointer; color:#fff2d2; border:1px solid var(--bronze-d); border-radius:3px;
  background:linear-gradient(180deg,#8f6c2e,#54401b);
  box-shadow:inset 0 1px 0 rgba(255,232,180,.35), 0 3px 0 #241a09;
}
.btn:hover{background:linear-gradient(180deg,#a67d36,#61491e)}
.btn:active{transform:translateY(2px); box-shadow:inset 0 1px 0 rgba(255,232,180,.2), 0 1px 0 #241a09}
.btn[disabled]{opacity:.35; cursor:default; transform:none}
.btn:focus-visible{outline:2px solid var(--bronze-l); outline-offset:2px}
.btn.ghostbtn{background:transparent; box-shadow:none; color:#a8906a}
.btn.ghostbtn:hover{background:rgba(237,201,127,.08); color:var(--bronze-l)}
.hint{font:400 11px/1.5 var(--mono); color:#6f7b88; text-align:center; margin-top:8px}

.chat{
  display:flex; flex-direction:column; min-height:340px;
  border:1px solid #0d1117; border-radius:3px; background:#05070a;
  box-shadow:inset 0 0 0 1px rgba(237,201,127,.08);
}
.chat-head{padding:7px 10px; border-bottom:1px solid #141b24; color:#6f7b88;
  font:600 10px/1 var(--mono); letter-spacing:.16em; text-transform:uppercase}
.log{flex:1; overflow-y:auto; padding:10px; font:400 12px/1.55 var(--mono); max-height:520px}
@media (max-width:820px){ .log{max-height:220px} .chat{min-height:0} }
.log p{margin:0 0 3px; word-wrap:break-word}
.log .t{color:#4d5a68}
.sys{color:var(--eq-white)} .hit{color:var(--eq-yellow)} .miss{color:var(--eq-red)}
.npc{color:var(--eq-blue)} .xp{color:var(--eq-green)} .dimline{color:#6f7b88}
.log::-webkit-scrollbar{width:9px}
.log::-webkit-scrollbar-thumb{background:#2a3340; border-radius:9px}

/* ---- end of game popup ---- */
.scrim{position:fixed; inset:0; z-index:50; display:none; align-items:center; justify-content:center;
  padding:18px; background:rgba(4,6,10,.78); backdrop-filter:blur(2px)}
.scrim.show{display:flex}
.modal{
  width:min(430px,100%); max-height:92vh; overflow:auto;
  background:linear-gradient(180deg,var(--stone) 0%,#10151c 100%);
  border:1px solid var(--bronze-d); border-radius:4px;
  box-shadow:inset 0 1px 0 rgba(237,201,127,.2), 0 24px 70px rgba(0,0,0,.8);
  animation:rise .28s cubic-bezier(.2,.9,.3,1);
}
@keyframes rise{from{opacity:0; transform:translateY(14px) scale(.98)} to{opacity:1; transform:none}}
.modal-head{padding:12px 16px; border-bottom:1px solid var(--bronze-d);
  background:linear-gradient(180deg,#3a2f1c,#241d12)}
.modal-head h2{margin:0; font-family:var(--display); font-weight:400; font-size:18px; color:var(--bronze-l)}
.modal-head p{margin:4px 0 0; font:600 10px/1 var(--mono); letter-spacing:.16em;
  text-transform:uppercase; color:#9c8354}
.modal-body{padding:16px}
.total{display:flex; align-items:baseline; gap:10px; margin-bottom:4px}
.total b{font-family:var(--display); font-weight:400; font-size:46px; line-height:1; color:var(--bronze-l)}
.total span{font:600 11px/1.4 var(--mono); letter-spacing:.12em; text-transform:uppercase; color:#7b8794}
.rank{font-size:13.5px; color:var(--parch); margin:8px 0 14px; line-height:1.5}
.rounds{border-top:1px solid #26303c; margin-bottom:14px}
.rounds div{display:flex; gap:10px; align-items:center; padding:6px 0; border-bottom:1px solid #1a222b;
  font:400 12px/1 var(--mono); color:var(--dim)}
.rounds .n{color:#5d6b7a; width:22px}
.rounds .z{flex:1; color:var(--parch)}
.rounds .p{color:var(--eq-yellow)}
.sharebox{width:100%; height:88px; resize:vertical; padding:9px 10px; margin-bottom:10px;
  font:400 11.5px/1.5 var(--mono); color:var(--parch); background:#05070a;
  border:1px solid #26303c; border-radius:3px}
.sharebox:focus{outline:none; border-color:var(--bronze-d)}
.modal-actions{display:flex; gap:8px; flex-wrap:wrap}
.modal-actions .btn{flex:1 1 auto}
.copied{font:400 11px/1.5 var(--mono); color:var(--eq-green); min-height:17px; margin:8px 0 0; text-align:center}

@media (prefers-reduced-motion:reduce){
  .pin.pop{animation:none}
  .modal{animation:none}
}
</style>
</head>

      <textarea class="sharebox" id="shareText" readonly aria-label="Score to share"></textarea>
      <div class="modal-actions">
        <button class="btn" id="copyBtn" type="button">Copy score</button>
        <button class="btn" id="shareBtn" type="button" hidden>Share</button>
        <button class="btn" id="againBtn" type="button">Play again</button>
        <button class="btn ghostbtn" id="closeBtn" type="button">Close</button>
      </div>
      <p class="copied" id="copied" role="status"></p>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";
  var NAT_W = 406, NAT_H = 499;
  var TARGET = { x: 200, y: 168 };     // the clasp point, right at his collar
  var ROUNDS = 5;

  // difficulty is purely how much of Raspen you can see. He always spins.
  var DIFF = {
    easy:   { blind: 1,   veil: 0,   falloff: 250, label: 'Easy',   see: 'fully visible' },
    normal: { blind: .38, veil: .55, falloff: 240, label: 'Medium', see: 'half visible' },
    hard:   { blind: 0,   veil: 1,   falloff: 230, label: 'Hard',   see: 'pitch black' }
  };

  var stage = document.getElementById('stage');
  var scene = document.getElementById('scene');
  var ghost = document.getElementById('ghost');
  var ov = document.getElementById('ov');
  var lead = document.getElementById('lead');
  var logEl = document.getElementById('log');
  var goBtn = document.getElementById('go');
  var showResultBtn = document.getElementById('showResult');
  var hintEl = document.getElementById('hint');
  var promptEl = document.getElementById('prompt');
  var roundLbl = document.getElementById('roundLbl');
  var scoreLbl = document.getElementById('scoreLbl');
  var soundBtn = document.getElementById('soundBtn');
  var scrim = document.getElementById('scrim');
  var shareText = document.getElementById('shareText');
  var copied = document.getElementById('copied');

  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var S = {
    phase: 'idle',              // idle | spinning | aiming | reveal | done
    round: 0, score: 0, best: 0, results: [],
    theta: 0, speed: 0, wobble: 0, t: 0, raf: 0,
    diff: 'normal', sound: true,
    cur: { x: 0, y: 0 }         // aim cursor, stage-local pixels
  };

  /* ---------- EverQuest-style chat log ---------- */
  var DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  var MONS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  function pad(n){ return (n < 10 ? '0' : '') + n; }
  function stamp(){
    var d = new Date();
    return '[' + DAYS[d.getDay()] + ' ' + MONS[d.getMonth()] + ' ' + pad(d.getDate()) + ' ' +
           pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()) + ' ' +
           d.getFullYear() + ']';
  }
  function log(text, cls){
    var p = document.createElement('p');
    var t = document.createElement('span');
    t.className = 't'; t.textContent = stamp() + ' ';
    var m = document.createElement('span');
    m.className = cls || 'sys'; m.textContent = text;
    p.appendChild(t); p.appendChild(m);
    logEl.appendChild(p);
    logEl.scrollTop = logEl.scrollHeight;
    while (logEl.children.length > 200) logEl.removeChild(logEl.firstChild);
  }
  function pick(a){ return a[Math.floor(Math.random()*a.length)]; }

  var RASPEN_SAYS = [
    "Raspen tells the group, 'Peggy cloak is a guaranteed drop. I have the parses.'",
    "Raspen tells the group, 'Two more hours of minos and we are geared.'",
    "Raspen tells the group, 'I have forty of these. I need one more.'",
    "Raspen tells the group, 'Do not med, I am pulling.'",
    "Raspen tells the group, 'This camp is mine. I have been here since 1999.'",
    "Raspen tells the group, 'That was a train. Sorry. Sorry. Sorry.'",
    "Raspen tells the group, 'Nobody move, I am tracking.'",
    "Raspen tells the group, 'Who needs cloak? Anyone? Anyone.'",
    "Raspen tells the group, 'Why is the room spinning.'"
  ];

  /* ---------- where did it land ---------- */
  function inRect(x,y,a,b,c,d){ return x>=a && x<=c && y>=b && y<=d; }
  function inEll(x,y,cx,cy,rx,ry){ var u=(x-cx)/rx, v=(y-cy)/ry; return u*u+v*v <= 1; }

  function zoneFor(x, y){
    if (Math.hypot(x-TARGET.x, y-TARGET.y) <= 20) return 'clasp';
    if (inEll(x,y,200,104,16,15)) return 'nose';
    if (inRect(x,y,110,58,162,116) || inRect(x,y,242,54,292,112)) return 'ear';
    if (inEll(x,y,199,86,50,64)) return 'face';
    if (inRect(x,y,36,180,104,264) || inRect(x,y,300,178,368,262)) return 'hand';
    if (inRect(x,y,143,150,258,282)) return 'tunic';
    if (inRect(x,y,74,158,150,258) || inRect(x,y,252,156,330,256)) return 'arm';
    if (inRect(x,y,138,283,266,398)) return 'legs';
    if (inRect(x,y,112,392,278,486)) return 'boot';
    if (x < 0 || x > NAT_W || y < 0 || y > NAT_H) return 'void';
    if (y > 380) return 'ground';
    return 'scenery';
  }

  var ZONE_NAME = {
    clasp:'Shoulders', tunic:'Chest', nose:'Nose', face:'Face', ear:'Ear', hand:'Hand',
    arm:'Arm', legs:'Legs', boot:'Boot', ground:'Ground', scenery:'A tree', void:'Out of zone'
  };

  var ZONE_LINES = {
    clasp:   ["You place the Peggy Cloak squarely on Raspen's shoulders. It drapes perfectly.",
              "The clasp catches. Raspen is wearing a Peggy Cloak and he does not know why."],
    tunic:   ["The cloak snags on Raspen's tunic. Close enough for a pickup group.",
              "It hangs off his chest like a bib. Raspen shrugs and keeps pulling."],
    nose:    ["You pin the cloak to Raspen's nose. Raspen can no longer see. Raspen is still pulling.",
              "Direct hit on the nose. Raspen makes a sound no gnome should make."],
    face:    ["The cloak lands across Raspen's face. The blind leading the blindfolded.",
              "Full facewrap. Raspen begins tracking a wall."],
    ear:     ["You pin the cloak to Raspen's ear. It flaps like a guild banner.",
              "Ear shot. He hears the ocean now, and also minotaurs."],
    hand:    ["Raspen catches the cloak. He tries to bag it. His bags are full of cloaks.",
              "He grabs it mid-air and links it in guild chat. Nobody responds."],
    arm:     ["The cloak dangles off his arm like a rogue's excuse for missing raid.",
              "Arm hit. He is wearing it as a sleeve now. Bold."],
    legs:    ["You pin the cloak to his trousers. A daring new look for Steamfont.",
              "Leg shot. He says it counts as a leggings slot. It does not."],
    boot:    ["The cloak lands on his boot. Movement speed unaffected.",
              "Boot. He walks it around camp for an hour before noticing."],
    ground:  ["The cloak hits the dirt. A minotaur will loot it in six minutes.",
              "It falls to the ground and rots. 30 minutes to decay."],
    scenery: ["You pin the cloak to a tree. Raspen laughs at you.",
              "You pin the cloak to a rock. The rock does not need a cloak."],
    void:    ["The cloak sails out of the zone entirely. Somewhere, a wizard is confused.",
              "You have pinned the cloak to the loading screen."]
  };

  /* ---------- sound ---------- */
  var actx = null;
  function beep(freq, dur, type, vol){
    if (!S.sound) return;
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = type || 'square'; o.frequency.value = freq;
      g.gain.setValueAtTime(vol || 0.05, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
      o.connect(g); g.connect(actx.destination);
      o.start(); o.stop(actx.currentTime + dur);
    } catch (e) { /* no audio, no problem */ }
  }
  function chime(){ [523,659,784,1046].forEach(function(f,i){ setTimeout(function(){ beep(f,.18,'triangle',.06); }, i*80); }); }

  /* ---------- geometry ---------- */
  function toNatural(localX, localY){
    var r = stage.getBoundingClientRect();
    var dx = localX - r.width/2, dy = localY - r.height/2;
    var th = -S.theta * Math.PI/180;
    var c = Math.cos(th), s = Math.sin(th);
    var lx = dx*c - dy*s, ly = dx*s + dy*c;
    return { x: (lx + r.width/2) / r.width * NAT_W, y: (ly + r.height/2) / r.height * NAT_H };
  }
  function setCursor(localX, localY){
    var r = stage.getBoundingClientRect();
    S.cur.x = Math.max(0, Math.min(r.width, localX));
    S.cur.y = Math.max(0, Math.min(r.height, localY));
    ghost.style.left = S.cur.x + 'px';
    ghost.style.top  = S.cur.y + 'px';
  }
  function cursorFromEvent(e){
    var r = stage.getBoundingClientRect();
    setCursor(e.clientX - r.left, e.clientY - r.top);
  }
  function centerCursor(){
    var r = stage.getBoundingClientRect();
    setCursor(r.width/2, r.height/2);
  }

  /* ---------- the spin ---------- */
  function spinLoop(){
    var last = performance.now();
    function step(now){
      if (S.phase !== 'spinning' && S.phase !== 'aiming'){ S.raf = 0; return; }
      var dt = Math.min(.05, (now - last)/1000); last = now; S.t += dt;
      // steady spin with a slow surge so you cannot just count beats
      var rate = S.speed * (1 + 0.28 * Math.sin(S.t * 0.9 + S.wobble));
      S.theta += rate * dt;
      scene.style.transform = 'rotate(' + S.theta + 'deg)';
      S.raf = requestAnimationFrame(step);
    }
    S.raf = requestAnimationFrame(step);
  }

  /* ---------- round flow ---------- */
  function cfg(){ return DIFF[S.diff]; }
  function applyVision(){
    stage.style.setProperty('--blind', String(cfg().blind));
    stage.style.setProperty('--veil', String(cfg().veil));
  }

  function startRound(){
    S.round++;
    ov.classList.remove('show');
    stage.classList.add('blind');
    applyVision();
    roundLbl.textContent = S.round + ' / ' + ROUNDS;
    goBtn.disabled = true;
    goBtn.textContent = 'Spinning...';
    promptEl.textContent = 'He is spinning. Wait for his shoulders to come around.';

    S.theta = Math.random() * 360;
    S.wobble = Math.random() * 6.28;
    S.speed = (Math.random() < .5 ? -1 : 1) * (95 + Math.random() * 85);  // deg/sec
    S.t = 0;
    S.phase = 'spinning';
    scene.style.transition = '';
    scene.style.transform = 'rotate(' + S.theta + 'deg)';

    if (S.round === 1){
      log('You have entered the Minotaur Caves.', 'sys');
      log(pick(RASPEN_SAYS), 'npc');
    }
    log('Raspen begins to spin. (' + cfg().label + ' \u2014 ' + cfg().see + ')', 'dimline');

    if (reduced){ S.speed *= .35; }
    spinLoop();
    setTimeout(beginAim, 650);
  }

  function beginAim(){
    if (S.phase !== 'spinning') return;
    S.phase = 'aiming';
    stage.classList.add('aiming');
    goBtn.textContent = 'Pin the cloak';
    goBtn.disabled = false;
    promptEl.textContent = 'Time it. Release when you think you are on his shoulders.';
    centerCursor();
  }

  function pinAt(localX, localY){
    if (S.phase !== 'aiming') return;
    S.phase = 'reveal';
    stage.classList.remove('aiming', 'blind');
    if (S.raf) { cancelAnimationFrame(S.raf); S.raf = 0; }

    var n = toNatural(localX, localY);
    var zone = zoneFor(n.x, n.y);
    var cx = Math.max(-30, Math.min(NAT_W + 30, n.x));
    var cy = Math.max(-30, Math.min(NAT_H + 30, n.y));

    var img = document.createElement('img');
    img.className = 'pin pop';
    img.src = ghost.src; img.alt = '';
    img.style.left = (cx / NAT_W * 100) + '%';
    img.style.top  = (cy / NAT_H * 100) + '%';
    img.style.setProperty('--r', ((Math.random()*30 - 15).toFixed(1)) + 'deg');
    scene.appendChild(img);

    var tag = document.createElement('div');
    tag.className = 'tag'; tag.textContent = S.round;
    tag.style.left = img.style.left; tag.style.top = img.style.top;
    scene.appendChild(tag);

    var d = Math.hypot(n.x - TARGET.x, n.y - TARGET.y);
    var pts = Math.max(0, Math.round(100 * (1 - d / cfg().falloff)));
    if (zone === 'clasp') pts = 100;
    S.score += pts;
    if (pts > S.best) S.best = pts;
    S.results.push({ round: S.round, zone: zone, pts: pts, dist: Math.round(d) });
    scoreLbl.textContent = S.score;

    lead.setAttribute('x1', cx); lead.setAttribute('y1', cy);
    lead.setAttribute('x2', TARGET.x); lead.setAttribute('y2', TARGET.y);
    ov.classList.add('show');

    // unwind to upright so you can see exactly what you did
    var home = Math.round(S.theta / 360) * 360;
    S.theta = home;
    scene.style.transition = reduced ? 'none' : 'transform .85s cubic-bezier(.3,.9,.3,1)';
    scene.style.transform = 'rotate(' + home + 'deg)';

    log(pick(ZONE_LINES[zone]), zone === 'clasp' ? 'hit' : (pts >= 55 ? 'hit' : 'miss'));
    log('You gain ' + pts + ' Peggy Points! (' + Math.round(d) + ' units off)',
        pts >= 55 ? 'xp' : 'dimline');
    if (zone === 'clasp'){ chime(); log('Raspen bows to you.', 'npc'); }
    else { beep(160 + Math.random()*40, .09, 'square', .04); }
    if (Math.random() < .5) setTimeout(function(){ log(pick(RASPEN_SAYS), 'npc'); }, 700);

    if (S.round >= ROUNDS){ setTimeout(finish, reduced ? 200 : 900); }
    else {
      goBtn.textContent = 'Next round';
      promptEl.textContent = 'Round ' + S.round + ' done. ' + (ROUNDS - S.round) + ' cloaks left in the bag.';
    }
  }

  function rankFor(score){
    if (score >= 440) return ['Ding! Raid-geared Cloak Pinner',
      'Raspen has invited you to camp. He has never invited anyone to camp.'];
    if (score >= 340) return ['Peggy Cloak Enthusiast',
      'Solid work while he was spinning. You would be trusted with a mez assignment.'];
    if (score >= 230) return ['Still better than a rogue',
      'Half your cloaks found gnome. The other half found Steamfont.'];
    if (score >= 120) return ['You have been struck by a minotaur',
      'Mostly trees. Raspen is unharmed and mildly amused.'];
    return ['Corpse run',
      'Not one cloak found a shoulder. Raspen looted them all and is now farming you.'];
  }

  function squares(){
    return S.results.map(function(r){
      if (r.zone === 'clasp') return '\uD83C\uDFAF';       // bullseye
      if (r.pts >= 75) return '\uD83D\uDFE9';              // green
      if (r.pts >= 45) return '\uD83D\uDFE8';              // yellow
      if (r.pts >= 15) return '\uD83D\uDFE7';              // orange
      return '\u2B1B';                                     // black
    }).join('');
  }

  function buildShare(){
    var r = rankFor(S.score);
    return 'Pin the Cloak on Raspen \u2014 ' + cfg().label + '\n' +
           S.score + ' / 500 Peggy Points\n' +
           squares() + '\n' +
           r[0] + '\n' +
           'ysutoolbox.com';
  }

  function finish(){
    S.phase = 'done';
    var r = rankFor(S.score);
    document.getElementById('mScore').textContent = S.score;
    document.getElementById('mRank').textContent = r[0] + ' \u2014 ' + r[1];
    document.getElementById('mSub').textContent = cfg().label + ' \u00b7 ' + ROUNDS + ' rounds \u00b7 best pin ' + S.best;
    var box = document.getElementById('mRounds');
    box.innerHTML = '';
    S.results.forEach(function(res){
      var row = document.createElement('div');
      var n = document.createElement('span'); n.className = 'n'; n.textContent = res.round;
      var z = document.createElement('span'); z.className = 'z';
      z.textContent = ZONE_NAME[res.zone] + '  \u00b7  ' + res.dist + ' units off';
      var p = document.createElement('span'); p.className = 'p'; p.textContent = res.pts;
      row.appendChild(n); row.appendChild(z); row.appendChild(p);
      box.appendChild(row);
    });
    shareText.value = buildShare();
    copied.textContent = '';
    openModal();
    goBtn.textContent = 'Play again';
    showResultBtn.hidden = false;
    promptEl.textContent = 'Five cloaks thrown. ' + S.score + ' Peggy Points.';
    log('You have gained a level! Welcome to level ' + Math.max(1, Math.round(S.score/10)) + '!', 'xp');
    log(r[0] + ' \u2014 ' + S.score + ' Peggy Points total.', 'hit');
  }

  var lastFocus = null;
  function openModal(){
    lastFocus = document.activeElement;
    scrim.classList.add('show');
    setTimeout(function(){ document.getElementById('copyBtn').focus(); }, 40);
  }
  function closeModal(){
    scrim.classList.remove('show');
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }

  function resetGame(){
    closeModal();
    S.round = 0; S.score = 0; S.best = 0; S.results = []; S.theta = 0;
    scoreLbl.textContent = '0';
    showResultBtn.hidden = true;
    Array.prototype.slice.call(scene.querySelectorAll('.pin, .tag')).forEach(function(n){ n.remove(); });
    ov.classList.remove('show');
    scene.style.transition = 'none'; scene.style.transform = 'rotate(0deg)';
    logEl.innerHTML = '';
    log('Loading, please wait...', 'dimline');
    startRound();
  }

  /* ---------- input ---------- */
  stage.addEventListener('pointermove', function(e){
    if (S.phase !== 'aiming') return;
    cursorFromEvent(e);
  });
  stage.addEventListener('pointerdown', function(e){
    if (S.phase !== 'aiming') return;
    try { stage.setPointerCapture(e.pointerId); } catch (err) {}
    cursorFromEvent(e);
    e.preventDefault();
  });
  stage.addEventListener('pointerup', function(e){
    if (S.phase !== 'aiming') return;
    cursorFromEvent(e);
    pinAt(S.cur.x, S.cur.y);
  });
  stage.addEventListener('keydown', function(e){
    if (S.phase !== 'aiming'){
      if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); goBtn.click(); }
      return;
    }
    var step = e.shiftKey ? 3 : 14;
    var moved = true;
    if (e.key === 'ArrowLeft') setCursor(S.cur.x - step, S.cur.y);
    else if (e.key === 'ArrowRight') setCursor(S.cur.x + step, S.cur.y);
    else if (e.key === 'ArrowUp') setCursor(S.cur.x, S.cur.y - step);
    else if (e.key === 'ArrowDown') setCursor(S.cur.x, S.cur.y + step);
    else moved = false;
    if (moved){ e.preventDefault(); return; }
    if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); pinAt(S.cur.x, S.cur.y); }
  });

  goBtn.addEventListener('click', function(){
    if (S.phase === 'idle' || S.phase === 'done'){ resetGame(); return; }
    if (S.phase === 'reveal'){ startRound(); return; }
    if (S.phase === 'aiming'){ pinAt(S.cur.x, S.cur.y); }
  });
  showResultBtn.addEventListener('click', function(){ if (S.phase === 'done') openModal(); });

  document.getElementById('againBtn').addEventListener('click', resetGame);
  document.getElementById('closeBtn').addEventListener('click', closeModal);
  scrim.addEventListener('click', function(e){ if (e.target === scrim) closeModal(); });
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape' && scrim.classList.contains('show')) closeModal();
  });

  document.getElementById('copyBtn').addEventListener('click', function(){
    var text = shareText.value;
    function ok(){ copied.textContent = 'Copied. Go paste it in guild chat.'; }
    function fallback(){
      shareText.focus(); shareText.select();
      var done = false;
      try { done = document.execCommand('copy'); } catch (e) {}
      copied.textContent = done ? 'Copied. Go paste it in guild chat.'
                                : 'Select the text above and copy it.';
    }
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(ok, fallback);
    } else { fallback(); }
  });

  var shareBtn = document.getElementById('shareBtn');
  if (navigator.share){
    shareBtn.hidden = false;
    shareBtn.addEventListener('click', function(){
      navigator.share({ title: 'Pin the Cloak on Raspen', text: shareText.value })
        .catch(function(){ /* dismissed */ });
    });
  }

  Array.prototype.slice.call(document.querySelectorAll('[data-diff]')).forEach(function(b){
    b.addEventListener('click', function(){
      Array.prototype.slice.call(document.querySelectorAll('[data-diff]')).forEach(function(o){
        o.setAttribute('aria-pressed', String(o === b));
      });
      S.diff = b.getAttribute('data-diff');
      applyVision();
      log('Difficulty set to ' + cfg().label + ' \u2014 ' + cfg().see + ', still spinning.', 'dimline');
    });
  });

  soundBtn.addEventListener('click', function(){
    S.sound = !S.sound;
    soundBtn.setAttribute('aria-pressed', String(S.sound));
    soundBtn.textContent = S.sound ? 'Sound on' : 'Sound off';
  });

  window.addEventListener('resize', function(){
    if (S.phase === 'aiming') centerCursor();
  });

  /* ---------- boot ---------- */
  applyVision();
  log('Welcome to Norrath, traveler.', 'sys');
  log('Raspen is camping the Minotaur Caves. He has been here a while.', 'dimline');
  log(pick(RASPEN_SAYS), 'npc');
  log('You have 5 Peggy Cloaks. Get one onto his shoulders while he spins.', 'sys');
})();
</script>
</body>
</html>
